analyses:
  - id: "00-preprocessing"
    title: "Stage 00 — Preprocessing"
    description: "EEG signal cleaning pipeline: channel prep → filtering → ICA → time alignment."
    notebooks:
      - path: "notebooks/00-preprocessing/eeg_data_inspection.ipynb"
        label: "EEG Data Inspection"
      - path: "notebooks/00-preprocessing/time_alignment.ipynb"
        label: "Time Alignment"
    plots:
      - id: "raw_signal_overlay"
        title: "Raw signal overlay (all channels)"
        notebook: "notebooks/00-preprocessing/eeg_data_inspection.ipynb"
        section: "Signal quality — raw vs after filtering"
        filename_pattern: "raw_signal_overlay.png"
        data_shape:
          input: "(n_channels=257, n_times_raw)"
          output: "Same — visual only"
        operation_order:
          - "Load .edf file per participant"
          - "Plot all channels stacked"
        interpretation: "High-amplitude bursts = artefacts (eye blinks, muscle). After ICA these should be absent."
        sketch_type: "timeseries_multichannel"

      - id: "psd_before_after"
        title: "PSD — before vs after filtering"
        notebook: "notebooks/00-preprocessing/eeg_data_inspection.ipynb"
        section: "Frequency inspection"
        filename_pattern: "psd_before_after.png"
        data_shape:
          input: "(n_channels, n_times)"
          output: "(n_frequencies,) — power per freq bin"
        operation_order:
          - "Compute Welch PSD on raw signal"
          - "Apply notch + bandpass filter"
          - "Compute Welch PSD on filtered signal"
          - "Overlay both spectra"
        interpretation: "Clean 1/f slope with no 50 Hz line noise after filtering."
        sketch_type: "psd"

      - id: "topomap_mean_power"
        title: "Topomap — mean channel power"
        notebook: "notebooks/00-preprocessing/eeg_data_inspection.ipynb"
        section: "Spatial quality check"
        filename_pattern: "topomap_mean_power.png"
        data_shape:
          input: "(n_channels, n_times)"
          output: "(n_channels,) — scalar power per electrode"
        operation_order:
          - "Compute RMS or mean absolute amplitude per channel"
          - "Map to 2D electrode positions"
          - "Render colour-coded topomap"
        interpretation: "Focal hot-spots indicate bad channels. Uniform distribution expected for good data."
        sketch_type: "topomap"

      - id: "tag_overlay"
        title: "TAG channel overlay across participants"
        notebook: "notebooks/00-preprocessing/time_alignment.ipynb"
        section: "Stimulus marker extraction"
        filename_pattern: "tag_overlay.png"
        data_shape:
          input: "(n_participants, n_times_raw) — TAG channel per participant"
          output: "Visual overlay only"
        operation_order:
          - "Extract TAG channel per participant"
          - "Overlay on shared time axis"
          - "Annotate lag offsets"
        interpretation: "Offsets between marker pulses indicate recording-start lags. Cross-correlation aligns them."
        sketch_type: "timeseries_offset"

      - id: "pairwise_lag_heatmap"
        title: "Pairwise lag heatmap"
        notebook: "notebooks/00-preprocessing/time_alignment.ipynb"
        section: "Cross-correlation lags"
        filename_pattern: "pairwise_lag_heatmap.png"
        data_shape:
          input: "(n_participants, n_times_raw)"
          output: "(n_participants, n_participants) — antisymmetric lag matrix (seconds)"
        operation_order:
          - "Cross-correlate TAG channels pairwise"
          - "Extract peak lag per pair"
          - "Assemble antisymmetric lag matrix"
        interpretation: "Small lags → near-simultaneous starts. Large lags → large crop needed."
        sketch_type: "matrix_heatmap"

  - id: "01-mean-variance"
    title: "Stage 01 — Mean-Variance Synchrony"
    description: |
      Model-free inter-subject synchrony proxy.
      Z-scoring is applied per subject and per channel along the time axis (axis=2)
      using scipy.stats.zscore: each channel's time series is transformed to mean=0
      and std=1. The data shape (n_subjects, n_channels, n_times) is preserved, but
      values become standardised units. This removes amplitude differences between
      subjects and channels, making the intersubject variance a meaningful synchrony
      measure: variance across subjects at each (channel, time) cell quantifies
      momentary disagreement — low variance indicates high synchrony.

      **Broadband Analysis:** The broadband analysis treats the full preprocessed EEG
      signal without frequency decomposition. It provides an overview of global
      inter-subject synchrony across all oscillatory components simultaneously, and
      serves as a reference baseline against which band-specific results can be compared.

      **Band-Wise Analysis:** The band-wise analysis repeats the same mean-variance
      pipeline independently for each canonical frequency band (delta 1–4 Hz, theta
      4–8 Hz, alpha 8–13 Hz, beta 13–30 Hz, gamma 30–70 Hz) after bandpass filtering.
      This reveals which oscillatory components drive synchrony and allows direct
      comparison of synchrony strength across frequency ranges.
    notebooks:
      - path: "notebooks/01-raw-mean-variance-analysis/mean_variance_broadband.ipynb"
        label: "Broadband Mean-Variance"
      - path: "notebooks/01-raw-mean-variance-analysis/mean_variance_bands.ipynb"
        label: "Per-Band Mean-Variance"
    plots:
      # ── Broadband analyses (mean_variance_broadband.ipynb) ──────────────

      - id: "zscore_rationale"
        title: "Z-score normalization — rationale (section 0)"
        notebook: "notebooks/01-raw-mean-variance-analysis/mean_variance_broadband.ipynb"
        section: "Data preparation"
        filename_pattern: "(no output plot — preprocessing step)"
        data_shape:
          input: "(n_subjects, n_channels, n_times) — raw broadband EEG"
          output: "(n_subjects, n_channels, n_times) — Z-scored along time axis"
        operation_order:
          - "For each subject s and channel c: subtract mean_t(x_{s,c}) and divide by std_t(x_{s,c})"
          - "scipy.stats.zscore applied along axis=2 — shape (n_subjects, n_channels, n_times) preserved"
          - "Result: every channel of every subject has mean=0 and std=1 along time"
          - "Removes amplitude differences between subjects and channels"
          - "After Z-scoring: intersubject variance at each (channel, time) cell purely reflects momentary disagreement in signal shape"
        interpretation: >
          Z-scoring is necessary before mean-variance analysis. Without it, amplitude
          differences between subjects dominate the variance signal and mask true
          neural synchrony. After Z-scoring, low variance across subjects at a given
          (channel, time) point directly indicates high inter-subject synchrony.
        sketch_type: "zscore_transform"

      - id: "timeseries_overview"
        title: "Intersubject time-series overview (two-panel)"
        notebook: "notebooks/01-raw-mean-variance-analysis/mean_variance_broadband.ipynb"
        section: "Time-series overview"
        filename_pattern: "timeseries*.png"
        data_shape:
          input: "(n_subjects, n_channels, n_times) — z-scored broadband"
          output: "Top: (n_subjects, n_times) + (n_times,); Bottom: (n_times,)"
        operation_order:
          - "From (n_subjects, n_channels, n_times): var(axis=0) → (n_channels, n_times), then mean over channels → (n_times,)"
          - "Top panel: overlay per-subject traces, group mean, ±1 SD band"
          - "Bottom panel: channel-averaged intersubject variance over time"
        interpretation: >
          Top panel shows how individual subjects' channel-averaged signals
          relate to the group mean. Bottom panel reveals temporal fluctuations
          in intersubject variance — dips indicate moments of high synchrony.
        sketch_type: "timeseries_two_panel"

      - id: "variance_distribution"
        title: "Intersubject variance distribution"
        notebook: "notebooks/01-raw-mean-variance-analysis/mean_variance_broadband.ipynb"
        section: "Intersubject variance distribution"
        filename_pattern: "variance_distribution*.png"
        data_shape:
          input: "(n_channels, n_times) — intersubject variance array"
          output: "histogram of all channel × time variance values"
        operation_order:
          - "Flatten (n_channels, n_times) variance array"
          - "Clip at 99th percentile — values beyond this are outliers and not displayed"
          - "Plot histogram with median marker and 99th-percentile right-boundary marker"
        interpretation: >
          Shows the distribution of intersubject variance across all channel and
          time pairs. The 99th-percentile marker marks the right boundary — values
          beyond it are clipped as outliers. A heavy left tail indicates many
          low-variance (high-synchrony) time-channel pairs.
        sketch_type: "histogram"

      - id: "windowed_bar"
        title: "Windowed synchrony — bar charts"
        notebook: "notebooks/01-raw-mean-variance-analysis/mean_variance_broadband.ipynb"
        section: "Windowed synchrony analysis"
        filename_pattern: "windowed_bar*.png"
        data_shape:
          input: "(n_subjects, n_channels, n_times) via stats dict"
          output: "(n_windows,) per-window mean z-scored signal and mean variance"
        operation_order:
          - "Divide recording into overlapping windows (default 2 s, 50% overlap)"
          - "Compute per-window mean of the z-scored signal and mean intersubject variance"
          - "Label windows below the 10th-percentile variance (lowest 10%) as sync candidates"
          - "Top bar chart (blue): mean of the z-scored signal per window (x = time, y = mean value)"
          - "Bottom bar chart (orange): mean variance per window; green bars mark sync-candidate windows"
        interpretation: >
          Green bars mark windows where intersubject variance is below the 10th-percentile
          synchrony threshold (lowest 10% variance). The top panel shows the corresponding
          mean z-scored signal level in those windows. Windowed statistics reduce noise at
          the cost of fine temporal resolution.
        sketch_type: "windowed_mean_var_bars"

      - id: "windowed_overlay"
        title: "Windowed synchrony — overlay with electrode heatmap"
        notebook: "notebooks/01-raw-mean-variance-analysis/mean_variance_broadband.ipynb"
        section: "Windowed synchrony analysis"
        filename_pattern: "windowed_overlay*.png"
        data_shape:
          input: "(n_subjects, n_channels, n_times) via stats dict + windows DataFrame"
          output: "3-panel: mean signal trace, variance trace with windowed mean, (n_channels, n_times) heatmap"
        operation_order:
          - "Panel 1: mean signal time-series — per-subject traces overlaid with group mean (same as timeseries_overview panel 1)"
          - "Panel 2: continuous intersubject variance (orange) overlaid with windowed mean variance step function (red)"
          - "Panel 3: heatmap of variance per channel over time — values are positive only, reddish colormap (no blue scale)"
        interpretation: >
          Panel 1 shows individual subject responses relative to the group mean.
          Panel 2 shows how the windowed step approximation tracks the continuous variance —
          useful for identifying synchrony episodes. The heatmap reveals which electrodes
          drive synchrony or desynchrony at each moment. Windowed statistics reduce noise
          at the cost of fine temporal resolution.
        sketch_type: "windowed_overlay_panels"

      # ── Per-band analyses (mean_variance_bands.ipynb) ───────────────────

      - id: "band_timeseries"
        title: "Per-band time-series overview"
        notebook: "notebooks/01-raw-mean-variance-analysis/mean_variance_bands.ipynb"
        section: "Per-band time-series overview"
        filename_pattern: "band_timeseries*.png"
        data_shape:
          input: "(n_subjects, n_channels, n_times) — z-scored, then bandpass-filtered"
          output: "5 bands × 2 columns: (n_times,) mean signal + (n_times,) variance per band"
        operation_order:
          - "Bandpass filter z-scored data into 5 bands (delta/theta/alpha/beta/gamma)"
          - "compute_intersubject_stats per band → mean signal and intersubject variance"
          - "Left column: group-mean signal with per-subject traces and ±1 SD band"
          - "Right column: channel-averaged intersubject variance with sync threshold"
        interpretation: >
          Reveals which frequency bands exhibit the strongest intersubject
          synchrony over time. Each row isolates a different oscillatory
          component. Band colors: delta=blue, theta=orange, alpha=green,
          beta=red, gamma=violet.
        sketch_type: "timeseries_multiband"

      - id: "band_variance_distributions"
        title: "Per-band variance distributions"
        notebook: "notebooks/01-raw-mean-variance-analysis/mean_variance_bands.ipynb"
        section: "Per-band intersubject variance distributions"
        filename_pattern: "band_variance_distributions*.png"
        data_shape:
          input: "(n_channels, n_times) intersubject variance per band"
          output: "one histogram per band (2-column grid)"
        operation_order:
          - "For each band: flatten (n_channels, n_times) variance"
          - "Clip at 99th percentile — right boundary, values beyond are outliers"
          - "Plot histogram with median marker and 99th-percentile right-boundary marker"
        interpretation: >
          Shows the distribution of intersubject variance across all channel and
          time pairs for each frequency band. The 99th-percentile marker is the
          right boundary; values beyond it are clipped as outliers. Compares
          the shape and spread across bands — narrower, left-shifted distributions
          indicate higher overall synchrony in that band.
        sketch_type: "histogram_facet"

      - id: "isc_matrices"
        title: "Pairwise ISC matrices per band"
        notebook: "notebooks/01-raw-mean-variance-analysis/mean_variance_bands.ipynb"
        section: "Pairwise inter-subject correlation (ISC) matrices"
        filename_pattern: "isc_matrices*.png"
        data_shape:
          input: "(n_subjects, n_channels, n_times) — z-scored and bandpass-filtered per band"
          output: "(n_subjects, n_subjects) — mean pairwise similarity per band"
        operation_order:
          - "For each subject pair (i, j) and band: compute the per-channel mean temporal product mean_t(x_i * x_j) on the bandpass-filtered signals"
          - "This equals Pearson correlation only if each filtered channel is re-normalized after filtering (mean 0, std 1), or equivalently divided by its post-filter std"
          - "Average per-channel similarity values: mean_ch(s_ch) → scalar ISC(i, j)"
          - "Assemble symmetric N×N matrix per band"
          - "Plot 5 heatmaps in a grid"
        interpretation: >
          Each heatmap shows the pairwise intersubject correlation for one
          frequency band. Outlier rows/columns (near zero) may indicate
          non-responders or poor data quality. Off-diagonal mean summarises
          group-level synchrony.
        sketch_type: "matrix_heatmap"

      - id: "band_windowed_analysis"
        title: "Per-band windowed synchrony analysis"
        notebook: "notebooks/01-raw-mean-variance-analysis/mean_variance_bands.ipynb"
        section: "Per-band windowed synchrony analysis"
        filename_pattern: "band_windowed*.png, windowed_per_band/*.png"
        data_shape:
          input: "(n_subjects, n_channels, n_times) — per-band intersubject stats"
          output: "(n_windows,) per band — bar charts, summary, and per-band detailed figures"
        operation_order:
          - "For each band: divide into overlapping windows (default 2 s, 50% overlap)"
          - "Compute per-window mean of the z-scored signal and mean variance; label sync candidates (variance < 10th pct)"
          - "Bar figure: multi-row bar chart — top row per band = mean signal (band color), bottom row = variance (band color, green = sync)"
          - "Summary figure: windowed variance with sync spans highlighted per band"
          - "Per-band overlay figure (3 panels per band): mean signal trace, continuous variance (band color) + windowed mean line (red), channel variance heatmap (reddish colormap, positive only)"
        interpretation: >
          Shows time-resolved synchrony detection independently per frequency band.
          Band colors: delta=blue, theta=orange, alpha=green, beta=red, gamma=violet.
          The summary figure enables quick cross-band comparison of where synchrony
          episodes occur. Per-band overlay figures add electrode-level detail.
          Windowed statistics reduce noise at the cost of fine temporal resolution.
        sketch_type: "grid_timeseries_heatmap"

  - id: "02-isc-broadband"
    title: "Stage 02 — ISC (Broadband + Per-Band)"
    description: |
      Inter-Subject Correlation (ISC) quantifies how similarly two or more subjects'
      brain responses track a shared stimulus. Both Pearson and Spearman correlations
      are computed and compared in every section.

      **Broadband ISC:** Computed on the full preprocessed EEG signal without frequency
      decomposition. Four analysis sections are run: (1) LOO-ISC distribution —
      leave-one-out ISC histograms and per-subject violin plots; (2) Pairwise ISC matrix —
      subject-to-subject correlation matrices with per-subject summaries; (3) Multi-Scale
      Sliding-Window ISC — time-resolved LOO-ISC at three window scales with 50 % overlap;
      (4) Mean-Field ISC — see below. Broadband results serve as the reference baseline
      across the analysis.

      **Per-Band ISC:** The same three channel-level ISC analyses (LOO-ISC, Pairwise ISC,
      Sliding-Window ISC) are repeated independently for each canonical EEG frequency band
      (delta 1–4 Hz, theta 4–8 Hz, alpha 8–13 Hz, beta 13–30 Hz, gamma 30–70 Hz) after
      bandpass filtering. Visualisations are largely identical to the broadband case. The
      only addition is a consensus synchrony analysis (band overlap) that identifies time
      windows where all frequency bands simultaneously show significant ISC.

      **Mean-Field ISC:** Rather than computing ISC per channel, the spatial mean across
      all electrodes is first taken to produce a single 1-D signal per subject, and ISC
      is then computed on that summary signal. This tests whether globally pooled neural
      activity synchronises across subjects and provides a complementary view to the
      channel-by-channel approach. Includes LOO-ISC bar charts, pairwise ISC matrices,
      and a time-course comparison of mean-field ISC vs channel-average ISC.
    notebooks:
      - path: "notebooks/02-isc-broadband-analysis/isc_broadband.ipynb"
        label: "ISC Broadband"
      - path: "notebooks/02-isc-broadband-analysis/isc_bands.ipynb"
        label: "ISC Per-Band"
    plots:
      - id: "loo_isc_pearson_vs_spearman"
        group: "Broadband ISC"
        title: "LOO-ISC Pearson vs Spearman (histogram + violin)"
        notebook: "notebooks/02-isc-broadband-analysis/isc_broadband.ipynb"
        section: "Section 1 — LOO-ISC Distribution (Pearson vs. Spearman)"
        filename_pattern: "loo_isc_*.png"
        data_shape:
          input: "(n_subjects, n_channels, n_times)"
          output: "(n_subjects, n_channels) — per-subject per-channel LOO-ISC, Pearson + Spearman"
        operation_order:
          - "For each subject s: correlate s with mean(all others) per channel (Pearson)"
          - "Repeat with Spearman rank correlation (optionally subsampled channels)"
          - "Average over subjects → mean_loo_isc (n_channels,)"
          - "Figure 1: two separate histograms (Pearson and Spearman) of mean per-channel LOO-ISC; negative-correlation tail shaded red; mean and median marked with vertical lines"
          - "Figure 2: violin plot of mean per-channel LOO-ISC across subjects, with individual subject dots overlaid (Pearson vs Spearman side-by-side)"
        interpretation: |
          Distributions shifted right of zero = above-chance synchrony.
          Pearson vs Spearman discrepancy flags outlier-driven correlations.
        sketch_type: "histogram_violin"

      - id: "pairwise_isc_pearson_vs_spearman"
        group: "Broadband ISC"
        title: "Pairwise ISC Pearson vs Spearman (heatmaps + bars + distribution)"
        notebook: "notebooks/02-isc-broadband-analysis/isc_broadband.ipynb"
        section: "Section 2 — Pairwise ISC Matrix (Pearson vs. Spearman)"
        filename_pattern: "pairwise_isc_*.png"
        data_shape:
          input: "(n_subjects, n_channels, n_times)"
          output: "(n_subjects, n_subjects) — pairwise Pearson r + Spearman ρ matrices"
        operation_order:
          - "For each subject pair (i, j): compute Pearson r per channel, then average across channels to obtain a single scalar similarity score"
          - "Repeat with Spearman rank correlation"
          - "Figure 1: side-by-side subject-to-subject correlation matrices (Pearson and Spearman) of mean correlation per channel; the main diagonal is intentionally left blank — it is always 1 and would distort the colour scale"
          - "Figure 2: bar plots of mean off-diagonal ISC per subject (Pearson vs Spearman side-by-side) — each bar is the mean of all off-diagonal entries in that subject's row"
          - "Figure 3: overlaid histogram of all off-diagonal matrix entries (pairwise correlations between subjects) for Pearson and Spearman, with mean markers"
        interpretation: |
          Outlier subjects (row/column near 0) = non-responders or poor data.
          Overall mean off-diagonal summarises group synchrony level.
        sketch_type: "matrix_heatmap_no_diag"

      - id: "multiscale_sliding_window_isc"
        group: "Broadband ISC"
        title: "Multi-scale sliding-window ISC (bar + overlay + comparison)"
        notebook: "notebooks/02-isc-broadband-analysis/isc_broadband.ipynb"
        section: "Section 3 — Time-Resolved LOO-ISC (Multi-Scale Windowed Analysis)"
        filename_pattern: "sw_isc_*.png"
        data_shape:
          input: "(n_subjects, n_channels, n_times)"
          output: "(n_windows, n_channels) at three scales (fine/medium/coarse); 50% window overlap"
        operation_order:
          - "Slide windows at three scales (fine / medium / coarse) across time with 50% overlap"
          - "Compute LOO-ISC per window → (n_windows, n_channels) at each scale"
          - "Figure 1: bar chart of mean Pearson LOO-ISC across channels per medium window, with variance indicators and a grand-mean marker"
          - "Figure 2: stair-wise line plot with multiple overlaid lines for different window sizes (light blue = fine, dark blue = medium, dashed red = coarse); below it, a heatmap at fine-time-window resolution showing per-channel ISC"
          - "Figure 3: stepped, overlaid line plot comparing Pearson and Spearman windowed LOO-ISC at medium window resolution; area below zero shaded red"
        interpretation: |
          Multi-scale view reveals both transient and sustained synchrony patterns.
          The heatmap reveals which electrodes drive synchrony (frontal vs occipital)
          at fine temporal resolution. Red-shaded area in Figure 3 highlights
          windows of desynchrony.
        sketch_type: "timeseries_heatmap"

      - id: "mean_field_loo_isc"
        group: "Mean-Field ISC"
        title: "Mean-field LOO-ISC per subject (bar chart)"
        notebook: "notebooks/02-isc-broadband-analysis/isc_broadband.ipynb"
        section: "Section 4 — Mean-Field ISC (Average Across Electrodes First)"
        filename_pattern: "mf_loo_isc_per_subject*.png"
        description: |
          **Mean-Field ISC:** Rather than computing ISC per channel and then averaging,
          the mean-field approach first averages the signal across all electrodes to obtain
          a single 1-D time series per subject, then computes ISC on that summary signal.
          This rationale tests whether global, spatially pooled neural activity synchronises
          across subjects — a complementary view to the channel-by-channel approach.
        data_shape:
          input: "(n_subjects, n_channels, n_times)"
          output: "(n_subjects,) — LOO-ISC on spatial mean, Pearson + Spearman"
        operation_order:
          - "mean(axis=1) → (n_subjects, n_times) spatial mean-field"
          - "LOO-ISC on mean-field signals (Pearson + Spearman)"
          - "Figure 1: bar plot of mean-field LOO-ISC per subject (Pearson vs Spearman side-by-side); same layout as the per-subject bar chart in Section 2"
        interpretation: |
          Large Pearson vs Spearman discrepancy = outlier time points in signal.
          Subjects below zero = desynchronised from group.
        sketch_type: "bar_grouped"

      - id: "mean_field_pairwise_isc"
        group: "Mean-Field ISC"
        title: "Mean-field pairwise ISC (heatmap)"
        notebook: "notebooks/02-isc-broadband-analysis/isc_broadband.ipynb"
        section: "Section 4 — Mean-Field ISC (Average Across Electrodes First)"
        filename_pattern: "mf_pairwise_isc*.png"
        data_shape:
          input: "(n_subjects, n_channels, n_times)"
          output: "(n_subjects, n_subjects) — pairwise Pearson r and Spearman ρ on the mean-field"
        operation_order:
          - "mean(axis=1) → (n_subjects, n_times) spatial mean-field"
          - "Figure 2: side-by-side ISC correlation matrix heatmaps (Pearson and Spearman) of the mean-field pairwise ISC; same layout as the Section 2 pairwise matrices"
        interpretation: |
          Complements LOO view — reveals specific subject pairs with high/low similarity.
          Clusters may indicate sub-groups of neural response profiles.
        sketch_type: "matrix_heatmap_no_diag"

      - id: "mean_field_vs_channel_avg_isc"
        group: "Mean-Field ISC"
        title: "Mean-field vs channel-average ISC (time course comparison)"
        notebook: "notebooks/02-isc-broadband-analysis/isc_broadband.ipynb"
        section: "Section 4 — Mean-Field ISC (Average Across Electrodes First)"
        filename_pattern: "mf_vs_channel_avg_isc*.png"
        data_shape:
          input: "(n_subjects, n_channels, n_times)"
          output: "(n_windows,) — two ISC time courses (channel-average vs mean-field)"
        operation_order:
          - "Channel-average path: sliding-window LOO-ISC per channel → mean(channels) → (n_windows,)"
          - "Mean-field path: mean(channels) → sliding-window LOO-ISC on 1-D signal → (n_windows,)"
          - "Figure 3: stair-wise overlay plot (same style as Section 3 Figure 2); blue = channel-average ISC, green dashed = mean-field ISC; the mean-field line is colour-coded by threshold (red below zero, green above zero)"
        interpretation: |
          Mean-field ISC captures global synchrony; channel-average ISC retains
          spatially distributed effects. Large divergence highlights
          whether synchrony is spatially uniform or driven by specific regions.
        sketch_type: "timeseries_comparison_overlay"

      # ── Per-band ISC analyses (isc_bands.ipynb) ────────────────────────────

      - id: "band_loo_isc_pearson_vs_spearman"
        group: "Per-Band ISC"
        title: "Per-band LOO-ISC Pearson vs Spearman (histogram + violin)"
        notebook: "notebooks/02-isc-broadband-analysis/isc_bands.ipynb"
        section: "Section 1 — Per-Band LOO-ISC Distribution (Pearson vs. Spearman)"
        filename_pattern: "*_loo_isc_*.png"
        data_shape:
          input: "(n_subjects, n_channels, n_times) — per band after bandpass filtering"
          output: "per band: (n_subjects, n_channels) — LOO-ISC, Pearson + Spearman"
        operation_order:
          - "Bandpass filter per band"
          - "compute_loo_isc per band (Pearson + Spearman)"
          - "Per band: two separate histograms (Pearson and Spearman) with red-shaded negative tail and mean/median markers"
          - "Per band: violin plot of mean per-channel LOO-ISC across subjects with individual subject dots overlaid"
        interpretation: |
          Alpha/theta with higher ISC under psilocybin → supports thalamo-cortical
          entrainment hypothesis. Pearson vs Spearman discrepancy per band
          highlights outlier sensitivity in specific frequency ranges.
        sketch_type: "histogram_facet"

      - id: "band_pairwise_isc_pearson_vs_spearman"
        group: "Per-Band ISC"
        title: "Per-band pairwise ISC Pearson vs Spearman (heatmaps + bars + distribution)"
        notebook: "notebooks/02-isc-broadband-analysis/isc_bands.ipynb"
        section: "Section 2 — Per-Band Pairwise ISC Matrix (Pearson vs. Spearman)"
        filename_pattern: "*_pairwise_isc_*.png"
        data_shape:
          input: "(n_subjects, n_channels, n_times) — per band"
          output: "per band: (n_subjects, n_subjects) — pairwise Pearson r + Spearman ρ"
        operation_order:
          - "Bandpass filter per band"
          - "Pairwise ISC per band (Pearson + Spearman)"
          - "Per band: side-by-side subject-to-subject correlation matrices (diagonal blank), per-subject mean off-diagonal bar charts, overlaid histogram of off-diagonal entries"
        interpretation: |
          Identifies frequency-specific inter-subject relationships.
          Clusters in specific bands may reveal band-selective neural coupling.
        sketch_type: "matrix_heatmap_no_diag"

      - id: "band_multiscale_sliding_window_isc"
        group: "Per-Band ISC"
        title: "Per-band multi-scale sliding-window ISC (bar + overlay + comparison)"
        notebook: "notebooks/02-isc-broadband-analysis/isc_bands.ipynb"
        section: "Section 3 — Per-Band Sliding-Window ISC (Multi-Scale)"
        filename_pattern: "*_sw_isc_*.png"
        data_shape:
          input: "(n_subjects, n_channels, n_times) — per band"
          output: "per band: (n_windows, n_channels) at three scales (fine/medium/coarse); 50% window overlap"
        operation_order:
          - "Bandpass filter per band"
          - "Slide windows at three scales with 50% overlap per band"
          - "Per band: bar chart with variance indicators (medium window, Pearson), stair-wise multi-scale overlay + fine-resolution heatmap, Pearson vs Spearman stepped overlay with red-shaded below-zero area"
        interpretation: |
          Temporally stable synchrony = sustained entrainment within that band.
          Episodic bursts = frequency-specific, event-driven responses.
        sketch_type: "grid_timeseries_heatmap"

      - id: "band_overlap"
        group: "Per-Band ISC"
        title: "Band overlap — consensus synchrony"
        notebook: "notebooks/02-isc-broadband-analysis/isc_bands.ipynb"
        section: "Section 4 — Band-Overlap Analysis"
        filename_pattern: "band_overlap*.png"
        data_shape:
          input: "(5_bands × n_windows,) — boolean significant masks"
          output: "(n_rows × n_windows) — binary raster + (n_windows,) band count"
        operation_order:
          - "Threshold each band's sliding-window ISC → binary mask"
          - "Stack masks into raster (rows=bands)"
          - "Sum across rows → band_count time course"
          - "Annotate windows where ALL bands significant (★)"
        interpretation: |
          Windows where all bands simultaneously significant = strongest, most global synchrony.
          Best candidates for 'peak synchrony' — correlatable with musical features or subjective ratings.
        sketch_type: "raster_overlap"

  - id: "03-wavelet-power"
    title: "Stage 03 — Wavelet Power Analysis"
    description: |
      Time-frequency analysis of EEG using complex Morlet wavelets.
      Wavelet power (amplitude²) is computed for broadband (DELTA–GAMMA) and
      per-canonical-band data, yielding 4D tensors of shape
      (n_subjects, n_channels, n_frequencies, n_times).
      Ten analyses explore spectral dynamics, inter-subject synchrony in the
      frequency domain, and spatial topographic patterns.
    notebooks:
      - path: "notebooks/03-wavelet-analysis/wavelet_power_exploration.ipynb"
        label: "Wavelet Power Exploration"
    plots:
      - id: "spectral_profile"
        title: "Grand-average spectral profile"
        notebook: "notebooks/03-wavelet-analysis/wavelet_power_exploration.ipynb"
        section: "1 — Grand-average spectral profile"
        filename_pattern: "spectral_profile_*.png"
        data_shape:
          input: "(n_subjects, n_channels, n_freqs, n_times)"
          output: "(n_freqs,) — mean power per frequency bin"
        operation_order:
          - "Average wavelet power across subjects and time"
          - "Average across channels → scalar per frequency"
          - "Plot power vs frequency"
        interpretation: "Classic 1/f slope with alpha peak ~10 Hz is expected. Deviations indicate artefacts or interesting frequency-specific effects."
        sketch_type: "psd"

      - id: "tf_map"
        title: "Time-frequency map (spectrogram)"
        notebook: "notebooks/03-wavelet-analysis/wavelet_power_exploration.ipynb"
        section: "2 — Time-frequency map"
        filename_pattern: "tf_map_*.png"
        data_shape:
          input: "(n_subjects, n_channels, n_freqs, n_times)"
          output: "(n_freqs, n_times) — channel- and subject-averaged power"
        operation_order:
          - "Average wavelet power across subjects"
          - "Average across channels → (n_freqs, n_times) image"
          - "Plot as 2D heatmap (frequency × time)"
        interpretation: "Bright regions = high power at that frequency and time. Alpha suppression during high-arousal musical passages and theta entrainment to rhythmic stimuli (e.g. psytrance beats) are expected markers of stimulus-driven engagement."
        sketch_type: "timeseries_heatmap"

      - id: "band_power_tc"
        title: "Per-band power time course"
        notebook: "notebooks/03-wavelet-analysis/wavelet_power_exploration.ipynb"
        section: "3 — Per-band power time course"
        filename_pattern: "band_power_tc_*.png"
        data_shape:
          input: "(n_subjects, n_channels, n_freqs, n_times) per band"
          output: "(n_times,) — z-scored group mean ± SD per band"
        operation_order:
          - "Average wavelet power within each canonical band"
          - "Z-score across time per subject per channel"
          - "Average across channels → (n_subjects, n_times)"
          - "Plot group mean ± SD per band"
        interpretation: "Frequency-resolved counterpart to the broadband time courses in 01-*. Theta increases during rhythmic passages; alpha suppression indicates engagement."
        sketch_type: "timeseries_multiband"

      - id: "intersubject_variance"
        title: "Intersubject variance in the wavelet domain"
        notebook: "notebooks/03-wavelet-analysis/wavelet_power_exploration.ipynb"
        section: "4 — Intersubject variance"
        filename_pattern: "intersubject_variance_*.png"
        data_shape:
          input: "(n_subjects, n_channels, n_times) — band-averaged, z-scored"
          output: "(n_times,) — variance across subjects, channel-averaged"
        operation_order:
          - "Average and z-score per band"
          - "Compute variance across subjects at each (channel, time)"
          - "Average across channels → variance time course"
          - "Plot per-band variance traces"
        interpretation: "Low variance = high inter-subject synchrony. Frequency-resolved synchrony proxy comparable to 01-* mean-variance analysis."
        sketch_type: "timeseries_variance"

      - id: "wavelet_loo_isc"
        title: "Wavelet-domain LOO-ISC per band"
        notebook: "notebooks/03-wavelet-analysis/wavelet_power_exploration.ipynb"
        section: "5 — Wavelet-domain LOO-ISC"
        filename_pattern: "wavelet_loo_isc_*.png"
        data_shape:
          input: "(n_subjects, n_channels, n_times) — band-averaged wavelet power"
          output: "(n_bands, n_channels) — mean LOO-ISC per band per channel"
        operation_order:
          - "Average within each canonical band → (n_subjects, n_channels, n_times)"
          - "compute_loo_isc per band"
          - "Bar chart + distribution across channels per band"
        interpretation: "Bands tracking stimulus features (delta/theta for rhythm, alpha for attention) expected to show higher ISC. Directly comparable to 02-* per-band ISC."
        sketch_type: "bar_grouped_bands"

      - id: "topomap_power_isc"
        title: "Topographic mapping of power LOO-ISC"
        notebook: "notebooks/03-wavelet-analysis/wavelet_power_exploration.ipynb"
        section: "6 — Topographic mapping"
        filename_pattern: "topomap_isc_*.png"
        data_shape:
          input: "(n_channels,) — mean LOO-ISC per channel per band"
          output: "2D scalp map — one topomap per frequency band"
        operation_order:
          - "Compute per-channel mean LOO-ISC for each band"
          - "Map values onto 2D electrode positions using MNE"
          - "Render one colour-coded topomap per band"
        interpretation: "Regions with high ISC = spatially consistent frequency-specific synchrony. Occipital alpha, frontal theta, or sensorimotor beta patterns are diagnostically informative."
        sketch_type: "topomap"

      - id: "tf_isc"
        title: "Time-frequency ISC spectrogram"
        notebook: "notebooks/03-wavelet-analysis/wavelet_power_exploration.ipynb"
        section: "7 — Time-frequency ISC"
        filename_pattern: "tf_isc_*.png"
        data_shape:
          input: "(n_subjects, n_channels × n_freqs, n_times)"
          output: "(n_freqs,) — channel-averaged LOO-ISC per frequency bin"
        operation_order:
          - "Reshape broadband data → (n_subjects, n_channels × n_freqs, n_times)"
          - "compute_loo_isc per frequency bin"
          - "Average across channels → ISC-vs-frequency profile"
        interpretation: "Continuous frequency-resolved synchrony without discrete band boundaries. Peaks indicate frequencies that best capture stimulus-driven synchrony."
        sketch_type: "timeseries_heatmap"

      - id: "sliding_window_isc_bands"
        title: "Sliding-window wavelet ISC per band"
        notebook: "notebooks/03-wavelet-analysis/wavelet_power_exploration.ipynb"
        section: "8 — Sliding-window wavelet ISC"
        filename_pattern: "sliding_window_isc_*.png"
        data_shape:
          input: "(n_subjects, n_channels, n_times) per band"
          output: "(n_bands × n_windows, n_channels) — time-resolved ISC"
        operation_order:
          - "Collapse frequency dimension per band"
          - "compute_sliding_window_isc per band"
          - "Plot time-resolved ISC traces per band"
        interpretation: "Time-resolved frequency-specific synchrony. Episodic bursts in a band signal event-driven entrainment to specific musical features."
        sketch_type: "grid_timeseries_heatmap"

      - id: "cross_frequency_coupling"
        title: "Cross-frequency coupling (band correlation matrix)"
        notebook: "notebooks/03-wavelet-analysis/wavelet_power_exploration.ipynb"
        section: "9 — Cross-frequency coupling"
        filename_pattern: "cross_freq_coupling_*.png"
        data_shape:
          input: "(n_bands × n_times) — channel-averaged, subject-mean power per band"
          output: "(n_bands, n_bands) — Pearson correlation matrix"
        operation_order:
          - "Channel-average and subject-mean per band → (n_bands, n_times)"
          - "Compute Pearson correlation between all band pairs"
          - "Plot as symmetric heatmap"
        interpretation: "High correlation between bands = co-modulation of oscillatory activity. Theta–alpha coupling is common; gamma–beta coupling can indicate rhythmic motor entrainment."
        sketch_type: "matrix_heatmap"

      - id: "power_phase_joint"
        title: "Power–phase joint ISC comparison"
        notebook: "notebooks/03-wavelet-analysis/wavelet_power_exploration.ipynb"
        section: "10 — Power-phase joint analysis"
        filename_pattern: "power_phase_isc_*.png"
        data_shape:
          input: "(n_bands,) power ISC and (n_bands,) phase ISC"
          output: "(n_bands × 2,) — grouped bar chart"
        operation_order:
          - "Compute per-band power LOO-ISC (from power cache)"
          - "Compute per-band phase LOO-ISC via cos(phase) (from phase cache)"
          - "Overlay in grouped bar chart per band"
        interpretation: "Bands where both power and phase ISC are high = robust, multi-modal synchrony. Discordant bands reveal amplitude-only or timing-only entrainment."
        sketch_type: "bar_grouped_bands"

  - id: "03-wavelet-phase"
    title: "Stage 03 — Wavelet Phase Analysis"
    description: |
      Phase analysis of EEG wavelet transforms. Phase is a circular quantity in
      (−π, π] — standard linear statistics are replaced by circular analogues
      (ITPC, cosine projection). Seven analyses explore phase distribution,
      inter-trial phase coherence (ITPC), and inter-subject phase synchrony.
    notebooks:
      - path: "notebooks/03-wavelet-analysis/wavelet_phase_exploration.ipynb"
        label: "Wavelet Phase Exploration"
    plots:
      - id: "phase_distribution"
        title: "Phase distribution sanity check"
        notebook: "notebooks/03-wavelet-analysis/wavelet_phase_exploration.ipynb"
        section: "1 — Phase distribution sanity check"
        filename_pattern: "phase_distribution_*.png"
        data_shape:
          input: "(n_subjects, n_channels, n_freqs, n_times)"
          output: "(n_bins,) — histogram of phase angles pooled across all dims"
        operation_order:
          - "Pool all phase values across subjects, channels, freqs, times"
          - "Histogram on [−π, π] (linear)"
          - "Polar histogram overlay"
        interpretation: "Wavelet phase should be approximately uniform. A strongly peaked distribution indicates artefacts or data-processing issues."
        sketch_type: "polar_histogram"

      - id: "itpc_spectrum"
        title: "Inter-Trial Phase Coherence (ITPC) spectrum"
        notebook: "notebooks/03-wavelet-analysis/wavelet_phase_exploration.ipynb"
        section: "2 — ITPC spectrum"
        filename_pattern: "itpc_spectrum_*.png"
        data_shape:
          input: "(n_subjects, n_channels, n_freqs, n_times)"
          output: "(n_freqs,) — ITPC = |mean(exp(i·phase))| averaged over time and channels"
        operation_order:
          - "Compute ITPC(f, t) = |mean_subjects(exp(i·phase))|"
          - "Average over time → (n_channels, n_freqs)"
          - "Average over channels → (n_freqs,)"
          - "Plot vs frequency"
        interpretation: "Peaks indicate frequencies where subjects' oscillatory timing is consistently entrained to the stimulus. High ITPC at alpha/theta = stimulus-locked phase alignment."
        sketch_type: "psd"

      - id: "tf_itpc_map"
        title: "Time-frequency ITPC map"
        notebook: "notebooks/03-wavelet-analysis/wavelet_phase_exploration.ipynb"
        section: "3 — Time-frequency ITPC map"
        filename_pattern: "tf_itpc_map_*.png"
        data_shape:
          input: "(n_subjects, n_channels, n_freqs, n_times)"
          output: "(n_freqs, n_times) — channel-averaged ITPC"
        operation_order:
          - "Compute ITPC(f, t) per channel"
          - "Average across channels → (n_freqs, n_times)"
          - "Plot as 2D heatmap"
        interpretation: "Bright regions = consistent inter-subject phase alignment at that frequency and time. Stimulus-locked phase resets visible as horizontal bands appearing at musical transitions."
        sketch_type: "timeseries_heatmap"

      - id: "band_itpc_tc"
        title: "Per-band ITPC time course"
        notebook: "notebooks/03-wavelet-analysis/wavelet_phase_exploration.ipynb"
        section: "4 — Per-band ITPC time course"
        filename_pattern: "band_itpc_tc_*.png"
        data_shape:
          input: "(n_subjects, n_channels, n_freqs, n_times) per band"
          output: "(n_times,) — channel-averaged, band-averaged ITPC"
        operation_order:
          - "Average phase within each canonical band → per-band phase arrays"
          - "Compute ITPC per band → (n_channels, n_times)"
          - "Average across channels → (n_times,) per band"
          - "Plot all bands as overlaid time courses"
        interpretation: "Frequency-resolved phase consistency over the stimulus duration. Sustained high ITPC = persistent stimulus-driven entrainment; episodic peaks = event-locked phase resets."
        sketch_type: "timeseries_multiband"

      - id: "phase_loo_isc"
        title: "Phase-based LOO-ISC per band"
        notebook: "notebooks/03-wavelet-analysis/wavelet_phase_exploration.ipynb"
        section: "5 — Phase-based LOO-ISC"
        filename_pattern: "phase_loo_isc_*.png"
        data_shape:
          input: "(n_subjects, n_channels, n_times) — band-averaged cos(phase)"
          output: "(n_bands, n_channels) — mean LOO-ISC per band"
        operation_order:
          - "Convert phase to cos(phase) per band"
          - "compute_loo_isc on cos(phase) arrays"
          - "Bar chart + distributions across channels per band"
        interpretation: "Pearson ISC on cos(phase) tests whether subjects share the same oscillatory timing independently of amplitude. Complementary to ITPC."
        sketch_type: "bar_grouped_bands"

      - id: "itpc_vs_isc"
        title: "ITPC vs. phase-ISC comparison"
        notebook: "notebooks/03-wavelet-analysis/wavelet_phase_exploration.ipynb"
        section: "6 — ITPC vs. phase-ISC comparison"
        filename_pattern: "itpc_vs_isc_*.png"
        data_shape:
          input: "(n_bands,) ITPC and (n_bands,) LOO-ISC(cos φ)"
          output: "(n_bands × 2,) — grouped bar chart"
        operation_order:
          - "Compute mean ITPC per band"
          - "Compute mean LOO-ISC(cos φ) per band"
          - "Overlay in grouped bar chart per band"
        interpretation: "Bands where both ITPC and phase-ISC are high = convergent evidence for stimulus-driven phase synchrony. Discrepancies reveal sensitivity differences between the two metrics."
        sketch_type: "bar_grouped_bands"

      - id: "topomap_phase_isc"
        title: "Topographic mapping of phase LOO-ISC"
        notebook: "notebooks/03-wavelet-analysis/wavelet_phase_exploration.ipynb"
        section: "7 — Topographic mapping"
        filename_pattern: "topomap_phase_isc_*.png"
        data_shape:
          input: "(n_channels,) — mean LOO-ISC(cos φ) per channel per band"
          output: "2D scalp map — one topomap per frequency band"
        operation_order:
          - "Compute per-channel mean LOO-ISC(cos φ) for each band"
          - "Map values onto 2D electrode positions using MNE"
          - "Render one colour-coded topomap per band"
        interpretation: "Regions with high phase ISC = spatially consistent inter-subject timing synchrony at each frequency. Compare with power ISC topomaps to identify amplitude vs. phase decoupling."
        sketch_type: "topomap"
