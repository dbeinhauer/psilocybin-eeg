  - id: "03-wavelet-phase"
    title: "Stage 03 — Wavelet Phase Analysis"
    description: |
      Phase analysis of EEG wavelet transforms. Phase is a circular quantity in
      (−π, π] — standard linear statistics are replaced by circular analogues
      (ITPC, cosine projection). Seven analyses explore phase distribution,
      inter-trial phase coherence (ITPC), and inter-subject phase synchrony.
    notebooks:
      - path: "notebooks/03-wavelet-analysis/wavelet_phase_exploration.ipynb"
        label: "Wavelet Phase Exploration"
    plots:
      - id: "phase_distribution"
        title: "Phase distribution sanity check"
        notebook: "notebooks/03-wavelet-analysis/wavelet_phase_exploration.ipynb"
        section: "1 — Phase distribution sanity check"
        filename_pattern: "phase_distribution_*.png"
        data_shape:
          input: "(n_subjects, n_channels, n_freqs, n_times)"
          output: "(n_bins,) — histogram of phase angles pooled across all dims"
        operation_order:
          - "Pool all phase values across subjects, channels, freqs, times"
          - "Histogram on [−π, π] (linear)"
          - "Polar histogram overlay"
        interpretation: "Wavelet phase should be approximately uniform. A strongly peaked distribution indicates artefacts or data-processing issues."
        sketch_type: "polar_histogram"

      - id: "itpc_spectrum"
        title: "Inter-Trial Phase Coherence (ITPC) spectrum"
        notebook: "notebooks/03-wavelet-analysis/wavelet_phase_exploration.ipynb"
        section: "2 — ITPC spectrum"
        filename_pattern: "itpc_spectrum_*.png"
        data_shape:
          input: "(n_subjects, n_channels, n_freqs, n_times)"
          output: "(n_freqs,) — ITPC = |mean(exp(i·phase))| averaged over time and channels"
        operation_order:
          - "Compute ITPC(f, t) = |mean_subjects(exp(i·phase))|"
          - "Average over time → (n_channels, n_freqs)"
          - "Average over channels → (n_freqs,)"
          - "Plot vs frequency"
        interpretation: "Peaks indicate frequencies where subjects' oscillatory timing is consistently entrained to the stimulus. High ITPC at alpha/theta = stimulus-locked phase alignment."
        sketch_type: "psd"

      - id: "tf_itpc_map"
        title: "Time-frequency ITPC map"
        notebook: "notebooks/03-wavelet-analysis/wavelet_phase_exploration.ipynb"
        section: "3 — Time-frequency ITPC map"
        filename_pattern: "tf_itpc_map_*.png"
        data_shape:
          input: "(n_subjects, n_channels, n_freqs, n_times)"
          output: "(n_freqs, n_times) — channel-averaged ITPC"
        operation_order:
          - "Compute ITPC(f, t) per channel"
          - "Average across channels → (n_freqs, n_times)"
          - "Plot as 2D heatmap"
        interpretation: "Bright regions = consistent inter-subject phase alignment at that frequency and time. Stimulus-locked phase resets visible as horizontal bands appearing at musical transitions."
        sketch_type: "timeseries_heatmap"

      - id: "band_itpc_tc"
        title: "Per-band ITPC time course"
        notebook: "notebooks/03-wavelet-analysis/wavelet_phase_exploration.ipynb"
        section: "4 — Per-band ITPC time course"
        filename_pattern: "band_itpc_tc_*.png"
        data_shape:
          input: "(n_subjects, n_channels, n_freqs, n_times) per band"
          output: "(n_times,) — channel-averaged, band-averaged ITPC"
        operation_order:
          - "Average phase within each canonical band → per-band phase arrays"
          - "Compute ITPC per band → (n_channels, n_times)"
          - "Average across channels → (n_times,) per band"
          - "Plot all bands as overlaid time courses"
        interpretation: "Frequency-resolved phase consistency over the stimulus duration. Sustained high ITPC = persistent stimulus-driven entrainment; episodic peaks = event-locked phase resets."
        sketch_type: "timeseries_multiband"

      - id: "phase_loo_isc"
        title: "Phase-based LOO-ISC per band"
        notebook: "notebooks/03-wavelet-analysis/wavelet_phase_exploration.ipynb"
        section: "5 — Phase-based LOO-ISC"
        filename_pattern: "phase_loo_isc_*.png"
        data_shape:
          input: "(n_subjects, n_channels, n_times) — band-averaged cos(phase)"
          output: "(n_bands, n_channels) — mean LOO-ISC per band"
        operation_order:
          - "Convert phase to cos(phase) per band"
          - "compute_loo_isc on cos(phase) arrays"
          - "Bar chart + distributions across channels per band"
        interpretation: "Pearson ISC on cos(phase) tests whether subjects share the same oscillatory timing independently of amplitude. Complementary to ITPC."
        sketch_type: "bar_grouped_bands"

      - id: "itpc_vs_isc"
        title: "ITPC vs. phase-ISC comparison"
