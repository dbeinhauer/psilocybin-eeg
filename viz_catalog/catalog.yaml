        filename_pattern: "power_phase_isc_*.png"
        data_shape:
          input: "(n_bands,) power ISC and (n_bands,) phase ISC"
          output: "(n_bands × 2,) — grouped bar chart"
        operation_order:
          - "Compute per-band power LOO-ISC (from power cache)"
          - "Compute per-band phase LOO-ISC via cos(phase) (from phase cache)"
          - "Overlay in grouped bar chart per band"
        interpretation: "Bands where both power and phase ISC are high = robust, multi-modal synchrony. Discordant bands reveal amplitude-only or timing-only entrainment."
        sketch_type: "bar_grouped_bands"

  - id: "03-wavelet-phase"
    title: "Stage 03 — Wavelet Phase Analysis"
    description: |
      Phase analysis of EEG wavelet transforms. Phase is a circular quantity in
      (−π, π] — standard linear statistics are replaced by circular analogues
      (ITPC, cosine projection). Seven analyses explore phase distribution,
      inter-trial phase coherence (ITPC), and inter-subject phase synchrony.
    notebooks:
      - path: "notebooks/03-wavelet-analysis/wavelet_phase_exploration.ipynb"
        label: "Wavelet Phase Exploration"
    plots:
      - id: "phase_distribution"
        title: "Phase distribution sanity check"
        notebook: "notebooks/03-wavelet-analysis/wavelet_phase_exploration.ipynb"
        section: "1 — Phase distribution sanity check"
        filename_pattern: "phase_distribution_*.png"
        data_shape:
          input: "(n_subjects, n_channels, n_freqs, n_times)"
          output: "(n_bins,) — histogram of phase angles pooled across all dims"
        operation_order:
          - "Pool all phase values across subjects, channels, freqs, times"
          - "Histogram on [−π, π] (linear)"
          - "Polar histogram overlay"
        interpretation: "Wavelet phase should be approximately uniform. A strongly peaked distribution indicates artefacts or data-processing issues."
        sketch_type: "polar_histogram"

      - id: "itpc_spectrum"
        title: "Inter-Trial Phase Coherence (ITPC) spectrum"
        notebook: "notebooks/03-wavelet-analysis/wavelet_phase_exploration.ipynb"
        section: "2 — ITPC spectrum"
        filename_pattern: "itpc_spectrum_*.png"
        data_shape:
          input: "(n_subjects, n_channels, n_freqs, n_times)"
          output: "(n_freqs,) — ITPC = |mean(exp(i·phase))| averaged over time and channels"
        operation_order:
          - "Compute ITPC(f, t) = |mean_subjects(exp(i·phase))|"
          - "Average over time → (n_channels, n_freqs)"
          - "Average over channels → (n_freqs,)"
          - "Plot vs frequency"
        interpretation: "Peaks indicate frequencies where subjects' oscillatory timing is consistently entrained to the stimulus. High ITPC at alpha/theta = stimulus-locked phase alignment."
        sketch_type: "psd"

      - id: "tf_itpc_map"
        title: "Time-frequency ITPC map"
        notebook: "notebooks/03-wavelet-analysis/wavelet_phase_exploration.ipynb"
        section: "3 — Time-frequency ITPC map"
        filename_pattern: "tf_itpc_map_*.png"
        data_shape:
          input: "(n_subjects, n_channels, n_freqs, n_times)"
          output: "(n_freqs, n_times) — channel-averaged ITPC"
        operation_order:
          - "Compute ITPC(f, t) per channel"
          - "Average across channels → (n_freqs, n_times)"
          - "Plot as 2D heatmap"
        interpretation: "Bright regions = consistent inter-subject phase alignment at that frequency and time. Stimulus-locked phase resets visible as horizontal bands appearing at musical transitions."
        sketch_type: "timeseries_heatmap"

      - id: "band_itpc_tc"
        title: "Per-band ITPC time course"
        notebook: "notebooks/03-wavelet-analysis/wavelet_phase_exploration.ipynb"
        section: "4 — Per-band ITPC time course"
        filename_pattern: "band_itpc_tc_*.png"
        data_shape:
          input: "(n_subjects, n_channels, n_freqs, n_times) per band"
          output: "(n_times,) — channel-averaged, band-averaged ITPC"
        operation_order:
          - "Average phase within each canonical band → per-band phase arrays"
          - "Compute ITPC per band → (n_channels, n_times)"
          - "Average across channels → (n_times,) per band"
          - "Plot all bands as overlaid time courses"
        interpretation: "Frequency-resolved phase consistency over the stimulus duration. Sustained high ITPC = persistent stimulus-driven entrainment; episodic peaks = event-locked phase resets."
        sketch_type: "timeseries_multiband"

      - id: "phase_loo_isc"
        title: "Phase-based LOO-ISC per band"
        notebook: "notebooks/03-wavelet-analysis/wavelet_phase_exploration.ipynb"
        section: "5 — Phase-based LOO-ISC"
        filename_pattern: "phase_loo_isc_*.png"
        data_shape:
          input: "(n_subjects, n_channels, n_times) — band-averaged cos(phase)"
          output: "(n_bands, n_channels) — mean LOO-ISC per band"
        operation_order:
          - "Convert phase to cos(phase) per band"
          - "compute_loo_isc on cos(phase) arrays"
          - "Bar chart + distributions across channels per band"
        interpretation: "Pearson ISC on cos(phase) tests whether subjects share the same oscillatory timing independently of amplitude. Complementary to ITPC."
        sketch_type: "bar_grouped_bands"

      - id: "itpc_vs_isc"
        title: "ITPC vs. phase-ISC comparison"
        notebook: "notebooks/03-wavelet-analysis/wavelet_phase_exploration.ipynb"
        section: "6 — ITPC vs. phase-ISC comparison"
        filename_pattern: "itpc_vs_isc_*.png"
        data_shape:
          input: "(n_bands,) ITPC and (n_bands,) LOO-ISC(cos φ)"
          output: "(n_bands × 2,) — grouped bar chart"
        operation_order:
          - "Compute mean ITPC per band"
          - "Compute mean LOO-ISC(cos φ) per band"
          - "Overlay in grouped bar chart per band"
        interpretation: "Bands where both ITPC and phase-ISC are high = convergent evidence for stimulus-driven phase synchrony. Discrepancies reveal sensitivity differences between the two metrics."
        sketch_type: "bar_grouped_bands"

      - id: "topomap_phase_isc"
        title: "Topographic mapping of phase LOO-ISC"
        notebook: "notebooks/03-wavelet-analysis/wavelet_phase_exploration.ipynb"
        section: "7 — Topographic mapping"
        filename_pattern: "topomap_phase_isc_*.png"
        data_shape:
          input: "(n_channels,) — mean LOO-ISC(cos φ) per channel per band"
          output: "2D scalp map — one topomap per frequency band"
        operation_order:
          - "Compute per-channel mean LOO-ISC(cos φ) for each band"
          - "Map values onto 2D electrode positions using MNE"
          - "Render one colour-coded topomap per band"
        interpretation: "Regions with high phase ISC = spatially consistent inter-subject timing synchrony at each frequency. Compare with power ISC topomaps to identify amplitude vs. phase decoupling."
        sketch_type: "topomap"

  - id: "04-wavelet-ica"
    title: "Stage 04 — Wavelet-ICA / PCA Analysis"
    description: |
      Dimensionality reduction of the 4D wavelet-power tensor
      (n_subjects, n_channels, n_freqs, n_times) via PCA and FastICA.
      Four reshape strategies expose different structure in the data:

      * **Super-Brain** — observations = time; features = S × C × F.
      * **Inter-Subject** — observations = S × T; features = C × F.
      * **Temporal** — observations = S × C; features = F × T.
      * **Inverted Super-Brain** — observations = S × C × F; features = time.

      Each approach yields PCA + ICA components, plus a standard set of
      diagnostic plots (scree, component time courses / maps, topomaps,
      inter-individual correlations, cross-component correlations).
    notebooks:
      - path: "notebooks/04-wavelet-ica-analysis/wavelet_ica_superbrain.ipynb"
        label: "Super-Brain"
      - path: "notebooks/04-wavelet-ica-analysis/wavelet_ica_intersubject.ipynb"
        label: "Inter-Subject"
      - path: "notebooks/04-wavelet-ica-analysis/wavelet_ica_temporal.ipynb"
        label: "Temporal"
      - path: "notebooks/04-wavelet-ica-analysis/wavelet_ica_inverted_superbrain.ipynb"
        label: "Inverted Super-Brain"
    plots:
      # ── Super-Brain approach ────────────────────────────────────────────
      - id: "superbrain_pca_scree"
        title: "Super-Brain — PCA scree + cumulative variance"
        notebook: "notebooks/04-wavelet-ica-analysis/wavelet_ica_superbrain.ipynb"
        section: "PCA — Scree plot"
        filename_pattern: "pca_scree_*.png"
        data_shape:
          input: "(n_pca,) — explained variance ratio"
          output: "Two-panel bar + cumulative line plot"
        operation_order:
          - "Reshape wavelet tensor → (T, S × C × F)"
          - "Fit sklearn PCA(n_components=n_pca)"
          - "Plot bar of per-PC variance + cumulative line with 90 % reference"
        interpretation: "How many components explain the bulk of the time-domain variance across the whole-cohort feature space."
        sketch_type: "bar_grouped"

      - id: "superbrain_pca_timecourses"
        title: "Super-Brain — PCA component time courses"
        notebook: "notebooks/04-wavelet-ica-analysis/wavelet_ica_superbrain.ipynb"
        section: "PCA — Component time courses"
        filename_pattern: "pca_timecourses_*.png"
        data_shape:
          input: "(T, n_pca) — PCA scores"
          output: "Vertical stack of time-series panels (top-K components)"
        operation_order:
          - "Project data onto top PCA components"
          - "Plot per-component score vs. time"
        interpretation: "Coherent temporal dynamics shared by the whole cohort — candidate drivers of stimulus-locked activity."
        sketch_type: "timeseries_multichannel"

      - id: "superbrain_pca_channel_topomap"
        title: "Super-Brain — PCA channel topomap"
        notebook: "notebooks/04-wavelet-ica-analysis/wavelet_ica_superbrain.ipynb"
        section: "PCA — Channel loadings"
        filename_pattern: "pca_channel_topomap_*.png"
        data_shape:
          input: "(n_pca, S, C, F) — reshaped loadings"
          output: "Row of 2D scalp maps — one topomap per component"
        operation_order:
          - "Reshape loadings to (K, S, C, F)"
          - "Marginalise |loading| over subjects and frequencies → (K, C)"
          - "Render one topomap per PC"
        interpretation: "Which electrodes drive each whole-cohort PCA component in space."
        sketch_type: "topomap"

      - id: "superbrain_pca_component_isc"
        title: "Super-Brain — PCA component LOO-ISC"
        notebook: "notebooks/04-wavelet-ica-analysis/wavelet_ica_superbrain.ipynb"
        section: "PCA — Component ISC"
        filename_pattern: "pca_component_isc_*.png"
        data_shape:
          input: "(n_pca,) — mean LOO-ISC per PC"
          output: "Bar chart (one bar per component)"
        operation_order:
          - "Project each subject's data onto the cohort components → (S, K, T)"
          - "Compute leave-one-out ISC per component (features = K)"
          - "Bar-plot mean LOO-ISC per component"
        interpretation: "Components whose time courses are reliable across subjects carry candidate stimulus-locked signal; low bars = idiosyncratic dynamics."
        sketch_type: "bar_grouped"

      - id: "superbrain_ica_topomap_mean"
        title: "Super-Brain — ICA topomap (mean across subjects)"
        notebook: "notebooks/04-wavelet-ica-analysis/wavelet_ica_superbrain.ipynb"
        section: "ICA — Topomaps (mean)"
        filename_pattern: "ica_topomap_mean_*.png"
        data_shape:
          input: "(C, n_ica) — subject-mean ICA channel loadings"
          output: "Row of scalp maps — one topomap per IC"
        operation_order:
          - "Reshape ICA mixing matrix → (S, C, F, n_ica)"
          - "Mean over subjects and frequencies → (C, n_ica)"
          - "Render one topomap per IC"
        interpretation: "Spatial signature of each independent component averaged across the cohort."
        sketch_type: "topomap"

      # ── Inter-Subject approach ──────────────────────────────────────────
      - id: "intersubject_pca_channel_freq_maps"
        title: "Inter-Subject — PCA channel × frequency maps"
        notebook: "notebooks/04-wavelet-ica-analysis/wavelet_ica_intersubject.ipynb"
        section: "PCA — Spatial-spectral component maps"
        filename_pattern: "pca_channel_freq_maps_*.png"
        data_shape:
          input: "(n_pca, C, F) — PCA loadings reshaped"
          output: "Grid of channel × frequency heatmaps (one per component)"
        operation_order:
          - "Reshape wavelet tensor → (S × T, C × F)"
          - "Fit PCA; reshape components back to (K, C, F)"
          - "Render each component as channel × frequency heatmap"
        interpretation: "Joint spatial-spectral patterns consistent across subjects — candidate cortical oscillatory motifs."
        sketch_type: "matrix_heatmap"

      - id: "intersubject_pca_topomaps"
        title: "Inter-Subject — PCA topomaps (freq-averaged)"
        notebook: "notebooks/04-wavelet-ica-analysis/wavelet_ica_intersubject.ipynb"
        section: "PCA — Topomaps"
        filename_pattern: "pca_topomaps_*.png"
        data_shape:
          input: "(n_pca, C) — channel marginal of component loadings"
          output: "Row of 2D scalp maps"
        operation_order:
          - "Mean |loading| over frequencies per component → (K, C)"
          - "Render one topomap per PC"
        interpretation: "Spatial part of each component, integrated across frequency."
        sketch_type: "topomap"

      - id: "intersubject_similarity"
        title: "Inter-Subject — per-component S × S correlation"
        notebook: "notebooks/04-wavelet-ica-analysis/wavelet_ica_intersubject.ipynb"
        section: "Inter-subject similarity"
        filename_pattern: "intersubject_similarity_*.png"
        data_shape:
          input: "(S, T, n_pca) — per-subject PCA scores"
          output: "Row of S × S correlation matrices (one per PC)"
        operation_order:
          - "Reshape scores → (S, T, n_pca)"
          - "Pearson-correlate subjects per component"
          - "Render one heatmap per component"
        interpretation: "Red-dominant matrices = component time courses align across subjects; noisy matrices = subject-specific components."
        sketch_type: "matrix_heatmap"

      - id: "intersubject_band_resolved_loadings"
        title: "Inter-Subject — band-resolved component loadings"
        notebook: "notebooks/04-wavelet-ica-analysis/wavelet_ica_intersubject.ipynb"
        section: "Band-resolved loadings"
        filename_pattern: "band_resolved_loadings_*.png"
        data_shape:
          input: "{band: (n_pca,)} — mean |loading| per band per PC"
          output: "Grouped bar chart (PCs × bands)"
        operation_order:
          - "Reshape PCA components → (K, C, F)"
          - "Mean |loading| over channels and freqs within each band"
          - "Plot grouped bars"
        interpretation: "Spectral dominance of each component across the canonical EEG bands."
        sketch_type: "bar_grouped_bands"

      # ── Temporal approach ───────────────────────────────────────────────
      - id: "temporal_ica_freq_time_maps"
        title: "Temporal — ICA frequency × time maps"
        notebook: "notebooks/04-wavelet-ica-analysis/wavelet_ica_temporal.ipynb"
        section: "ICA — Frequency × time maps"
        filename_pattern: "ica_freq_time_maps_*.png"
        data_shape:
          input: "(n_ica, F, T) — ICA mixing matrix reshaped"
          output: "Grid of freq × time heatmaps (one per IC)"
        operation_order:
          - "Reshape wavelet tensor → (S × C, F × T)"
          - "Fit PCA then FastICA"
          - "Reshape ICA mixing → (n_ica, F, T) and plot"
        interpretation: "Each IC = a freq × time motif shared across subjects and channels."
        sketch_type: "matrix_heatmap"

      - id: "temporal_ica_spectral_profiles"
        title: "Temporal — ICA spectral profiles"
        notebook: "notebooks/04-wavelet-ica-analysis/wavelet_ica_temporal.ipynb"
        section: "ICA — Spectral profiles"
        filename_pattern: "ica_spectral_profiles_*.png"
        data_shape:
          input: "(n_ica, F) — time-averaged IC frequency profiles"
          output: "Vertical stack of frequency curves with band shading"
        operation_order:
          - "Reshape ICA mixing → (n_ica, F, T)"
          - "Mean over time axis → (n_ica, F)"
          - "Plot curves with canonical band shading"
        interpretation: "Peak frequencies identify each IC's spectral identity (delta, theta, alpha, beta, gamma)."
        sketch_type: "timeseries_multiband"

      - id: "temporal_ica_band_energy"
        title: "Temporal — ICA band-resolved energy"
        notebook: "notebooks/04-wavelet-ica-analysis/wavelet_ica_temporal.ipynb"
        section: "ICA — Band energy"
        filename_pattern: "ica_band_energy_*.png"
        data_shape:
          input: "{band: (n_ica,)} — mean squared weight per band"
          output: "Grouped bar chart (ICs × bands)"
        operation_order:
          - "Reshape mixing → (n_ica, F, T)"
          - "Mean squared weight over (F_in_band, T) per IC per band"
          - "Plot grouped bars"
        interpretation: "Which frequency band carries each IC's energy."
        sketch_type: "bar_grouped_bands"

      - id: "temporal_ica_component_correlation"
        title: "Temporal — ICA temporal-profile correlation matrix"
        notebook: "notebooks/04-wavelet-ica-analysis/wavelet_ica_temporal.ipynb"
        section: "ICA — Component correlation"
        filename_pattern: "ica_component_correlation_*.png"
        data_shape:
          input: "(n_ica, T) — freq-averaged IC time profiles"
          output: "n_ica × n_ica correlation heatmap"
        operation_order:
          - "Freq-average IC mixing → (n_ica, T)"
          - "Pearson-correlate across ICs"
          - "Render heatmap"
        interpretation: "Near-zero off-diagonals confirm independent temporal dynamics; structure suggests redundant components."
        sketch_type: "matrix_heatmap"

      # ── Inverted Super-Brain approach ───────────────────────────────────
      - id: "inverted_ica_temporal_patterns"
        title: "Inverted Super-Brain — ICA temporal patterns"
        notebook: "notebooks/04-wavelet-ica-analysis/wavelet_ica_inverted_superbrain.ipynb"
        section: "ICA — Temporal patterns"
        filename_pattern: "ica_temporal_patterns_*.png"
        data_shape:
          input: "(n_ica, T) — ICA mixing transpose"
          output: "Vertical stack of temporal component time-series"
        operation_order:
          - "Reshape wavelet tensor → (S × C × F, T)"
          - "Fit PCA then FastICA"
          - "Transpose mixing matrix → (n_ica, T); plot"
        interpretation: "Each row = a temporal motif whose spatial/spectral weights are distributed across all (subject, channel, frequency) triplets."
        sketch_type: "timeseries_multichannel"

      - id: "inverted_ica_channel_topomap"
        title: "Inverted Super-Brain — ICA channel topomap (|score|)"
        notebook: "notebooks/04-wavelet-ica-analysis/wavelet_ica_inverted_superbrain.ipynb"
        section: "ICA — Channel topomap"
        filename_pattern: "ica_channel_topomap_*.png"
        data_shape:
          input: "(C, n_ica) — mean |score| over S and F"
          output: "Row of 2D scalp maps — one topomap per IC"
        operation_order:
          - "Reshape ICA sources → (S, C, F, n_ica)"
          - "Mean |score| over subjects and frequencies → (C, n_ica)"
          - "Render one topomap per IC"
        interpretation: "Which electrodes contribute most to each independent temporal motif."
        sketch_type: "topomap"

      - id: "inverted_ica_freq_loadings"
        title: "Inverted Super-Brain — ICA frequency loadings"
        notebook: "notebooks/04-wavelet-ica-analysis/wavelet_ica_inverted_superbrain.ipynb"
        section: "ICA — Frequency loadings"
        filename_pattern: "ica_freq_loadings_*.png"
        data_shape:
          input: "(F, n_ica) — mean |score| over S and C"
          output: "Vertical stack of frequency curves"
        operation_order:
          - "Reshape ICA sources → (S, C, F, n_ica)"
          - "Mean |score| over subjects and channels → (F, n_ica)"
          - "Plot curves per component"
        interpretation: "Which frequencies contribute most to each independent temporal motif."
        sketch_type: "timeseries_multiband"

      - id: "inverted_ica_spectrograms"
        title: "Inverted Super-Brain — ICA spectrograms"
        notebook: "notebooks/04-wavelet-ica-analysis/wavelet_ica_inverted_superbrain.ipynb"
        section: "ICA — Spectrograms"
        filename_pattern: "ica_spectrograms_*.png"
        data_shape:
          input: "(n_ica, T) — ICA temporal patterns"
          output: "Vertical stack of STFT spectrograms"
        operation_order:
          - "Apply scipy.signal.spectrogram to each IC time course"
          - "Plot stacked spectrograms"
        interpretation: "Reveals time-resolved spectral content for each independent temporal motif."
        sketch_type: "timeseries_heatmap"

  # =========================================================================
  # Stage 04 — Wavelet-ICA (per-band)
  # =========================================================================
  - id: "04-wavelet-ica-bands"
    title: "Stage 04 — Wavelet-ICA / PCA Decomposition (Per-Band)"
    description: >
      Per-frequency-band variant of the Stage-04 decomposition pipeline.
      Raw EEG is band-pass filtered into five standard bands (delta, theta,
      alpha, beta, gamma) before computing the wavelet-power tensor and
      running all four PCA/ICA strategies.  Cross-band comparison plots
      highlight which bands capture the most variance and how spatial
      patterns differ across the frequency spectrum.
    notebooks:
      - path: "notebooks/04-wavelet-ica-analysis/wavelet_ica_superbrain.ipynb"
        label: "Super-Brain (broadband + band reference)"
      - path: "notebooks/04-wavelet-ica-analysis/wavelet_ica_intersubject.ipynb"
        label: "Inter-Subject (broadband + band reference)"
      - path: "notebooks/04-wavelet-ica-analysis/wavelet_ica_temporal.ipynb"
        label: "Temporal (broadband + band reference)"
      - path: "notebooks/04-wavelet-ica-analysis/wavelet_ica_inverted_superbrain.ipynb"
        label: "Inverted Super-Brain (broadband + band reference)"
    plots:
      # ── Cross-band summary ────────────────────────────────────────────
      - id: "cross_band_scree_comparison"
        title: "Cross-band scree comparison"
        notebook: "notebooks/04-wavelet-ica-analysis/wavelet_ica_superbrain.ipynb"
        section: "Cross-band comparison"
        filename_pattern: "*_scree_comparison_*.png"
        data_shape:
          input: "(5_bands × n_pca,) — explained-variance ratios per band"
          output: "Overlay scree + cumulative curves per band"
        operation_order:
          - "Band-pass filter raw EEG into 5 standard bands"
          - "Compute wavelet 4D tensor per band"
          - "Run PCA per band"
          - "Overlay scree curves with band colours"
        interpretation: "Shows which frequency bands concentrate the most PCA-captured variance and how dimensionality differs across bands."
        sketch_type: "timeseries_multiband"
      - id: "cross_band_variance_summary"
        title: "Cross-band PCA variance summary"
        notebook: "notebooks/04-wavelet-ica-analysis/wavelet_ica_superbrain.ipynb"
        section: "Cross-band comparison"
        filename_pattern: "variance_summary_*.png"
        data_shape:
          input: "(4_approaches × 5_bands,) — total PCA variance captured"
          output: "Grouped bar chart: approaches × bands"
        operation_order:
          - "Aggregate top-K PCA variance per approach per band"
          - "Group bars by band, colour by approach"
        interpretation: "Comparing total captured variance across approaches reveals which decomposition best preserves signal structure in each band."
        sketch_type: "bar_grouped_bands"
      # ── Per-band Super-Brain ──────────────────────────────────────────
      - id: "band_superbrain_scree"
        title: "Per-band Super-Brain PCA scree"
        notebook: "notebooks/04-wavelet-ica-analysis/wavelet_ica_superbrain.ipynb"
        section: "PCA — Scree plot (per-band)"
        filename_pattern: "*_pca_scree_*.png"
        data_shape:
          input: "(n_pca,) — per-band explained-variance ratios"
          output: "Bar + cumulative line (one per band)"
        operation_order:
          - "Band-pass filter → wavelet 4D → reshape Super-Brain"
          - "PCA fit → variance ratios"
        interpretation: "How many components are needed to capture 90 % of variance within each band."
        sketch_type: "psd"
      - id: "band_superbrain_ica_topomap"
        title: "Per-band Super-Brain ICA topomap (mean)"
        notebook: "notebooks/04-wavelet-ica-analysis/wavelet_ica_superbrain.ipynb"
        section: "ICA — Topomap mean (per-band)"
        filename_pattern: "*_ica_topomap_mean_*.png"
        data_shape:
          input: "(n_channels, n_ica) — mean ICA channel loadings within band"
          output: "Grid of MNE topomaps"
        operation_order:
          - "Average ICA mixing matrix over freq axis within band"
          - "Average across subjects"
          - "Plot MNE topomap per IC"
        interpretation: "Spatial focus of each independent component when the signal is restricted to a single frequency band."
        sketch_type: "topomap"
      # ── Per-band Inter-Subject ────────────────────────────────────────
      - id: "band_intersubject_channel_freq"
        title: "Per-band Inter-Subject PCA channel × freq maps"
        notebook: "notebooks/04-wavelet-ica-analysis/wavelet_ica_intersubject.ipynb"
        section: "PCA — Channel × freq (per-band)"
        filename_pattern: "*_pca_channel_freq_maps_*.png"
        data_shape:
          input: "(n_pca, C, F_band) — component loadings within band"
          output: "Heatmap grid: components × (channel, freq)"
        operation_order:
          - "Reshape PCA components to (K, C, F_band)"
          - "Plot channel × frequency heatmaps"
        interpretation: "Reveals channel-frequency interaction patterns within a narrow band."
        sketch_type: "matrix_heatmap"
      - id: "band_intersubject_ica_topomap"
        title: "Per-band Inter-Subject ICA topomap (mean)"
        notebook: "notebooks/04-wavelet-ica-analysis/wavelet_ica_intersubject.ipynb"
        section: "ICA — Topomap mean (per-band)"
        filename_pattern: "*_ica_topomap_mean_*.png"
        data_shape:
          input: "(n_channels, n_ica) — freq-averaged ICA loadings within band"
          output: "Grid of MNE topomaps"
        operation_order:
          - "Average ICA mixing over freq within band"
          - "Plot MNE topomap per IC"
        interpretation: "Spatial footprint of each IC when only a narrow frequency range is considered."
        sketch_type: "topomap"
      # ── Per-band Temporal ─────────────────────────────────────────────
      - id: "band_temporal_freq_time"
        title: "Per-band Temporal ICA freq × time maps"
        notebook: "notebooks/04-wavelet-ica-analysis/wavelet_ica_temporal.ipynb"
        section: "ICA — Freq × time (per-band)"
        filename_pattern: "*_ica_freq_time_maps_*.png"
        data_shape:
          input: "(n_ica, F_band, T) — ICA mixing reshaped"
          output: "Heatmap grid: freq × time per IC"
        operation_order:
          - "Reshape ICA mixing to (F, T, n_ica)"
          - "Transpose to (n_ica, F, T)"
          - "Plot freq × time heatmap per IC"
        interpretation: "Time-frequency energy concentration of each IC within a single band."
        sketch_type: "timeseries_heatmap"
      - id: "band_temporal_ica_topomap"
        title: "Per-band Temporal ICA topomap (mean)"
        notebook: "notebooks/04-wavelet-ica-analysis/wavelet_ica_temporal.ipynb"
        section: "ICA — Topomap mean (per-band)"
        filename_pattern: "*_ica_topomap_mean_*.png"
        data_shape:
          input: "(n_channels, n_ica) — channel-mean ICA scores within band"
          output: "Grid of MNE topomaps"
        operation_order:
          - "Average ICA scores across subjects → (C, n_ica)"
          - "Plot MNE topomap per IC"
        interpretation: "Scalp distribution of each IC from the temporal decomposition restricted to a single band."
        sketch_type: "topomap"
      # ── Per-band Inverted Super-Brain ─────────────────────────────────
      - id: "band_inverted_temporal_patterns"
        title: "Per-band Inverted Super-Brain ICA temporal patterns"
        notebook: "notebooks/04-wavelet-ica-analysis/wavelet_ica_inverted_superbrain.ipynb"
        section: "ICA — Temporal patterns (per-band)"
        filename_pattern: "*_ica_temporal_patterns_*.png"
        data_shape:
          input: "(n_ica, T) — ICA mixing transposed"
          output: "Stacked time course subplots"
        operation_order:
          - "Transpose ICA mixing → (n_ica, T)"
          - "Plot each IC time course"
        interpretation: "Temporal dynamics of each independent spatial-spectral motif within a narrow band."
        sketch_type: "timeseries_multichannel"
      - id: "band_inverted_ica_topomap"
        title: "Per-band Inverted Super-Brain ICA topomap (mean)"
        notebook: "notebooks/04-wavelet-ica-analysis/wavelet_ica_inverted_superbrain.ipynb"
        section: "ICA — Topomap mean (per-band)"
        filename_pattern: "*_ica_topomap_mean_*.png"
        data_shape:
          input: "(n_channels, n_ica) — mean ICA score over freq within band"
          output: "Grid of MNE topomaps"
        operation_order:
          - "Mean ICA scores over subjects and freq → (C, n_ica)"
          - "Plot MNE topomap per IC"
        interpretation: "Where each independent component is spatially concentrated when the analysis is restricted to a single band."
        sketch_type: "topomap"
